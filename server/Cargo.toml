[package]
name = "cmantic-ls"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Language server providing C-Mantic style C/C++ refactorings"
repository = "https://github.com/timdevorg/cmantic-zed"
publish = false

[[bin]]
name = "cmantic-ls"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }
tower-lsp-server = "0.23.0"
tree-sitter = "0.27.2"
tree-sitter-cpp = "0.23.4"
